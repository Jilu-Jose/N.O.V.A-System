<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - N.O.V.A</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
        }

        .login-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 50px;
            border-radius: 24px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #fff;
        }

        p {
            color: var(--text-secondary);
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #bbb;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: rgba(255, 255, 255, 0.3);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
        }

        .social-login {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-social {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            text-decoration: none;
            font-size: 0.95rem;
            transition: background 0.3s;
        }

        .btn-social:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .divider {
            margin: 25px 0;
            display: flex;
            align-items: center;
            color: #666;
            font-size: 0.8rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 0 10px;
        }
    </style>
</head>

<body data-theme="dark">
    <div class="login-card">
        <a href="/"
            style="text-decoration: none; color: #fff; font-weight: 800; font-size: 1.5rem; letter-spacing: 2px; display: block; margin-bottom: 20px;">N.O.V.A</a>
        <h1>Welcome Back</h1>
        <p>Enter your credentials to access the satellite dashboard</p>

        <form onsubmit="event.preventDefault(); alert('Auth not implemented yet!');">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="name@company.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Sign In</button>
        </form>

        <div class="divider">OR CONTINUE WITH</div>

        <div class="social-login">
            <a href="#" class="btn-social" onclick="alert('Auth not implemented yet!');">
                <img src="https://www.google.com/favicon.ico" width="18" alt="Google">
                Sign in with Google
            </a>
            <a href="#" class="btn-social" onclick="alert('Auth not implemented yet!');">
                <img src="https://www.microsoft.com/favicon.ico" width="18" alt="Microsoft">
                Sign in with Microsoft
            </a>
            <a href="#" class="btn-social" onclick="alert('Auth not implemented yet!');">
                <img src="https://www.apple.com/favicon.ico" width="18" alt="Apple">
                Sign in with Apple
            </a>
        </div>
    </div>
</body>

</html>
